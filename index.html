<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>洛克王国 · 伤害计算器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #e2f0da;
            padding: 12px 8px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 580px;
            width: 100%;
            margin: 0 auto;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1e4a2b;
            text-align: center;
            margin-bottom: 2px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #c8e0bc;
        }
        .subhead {
            text-align: center;
            color: #3d6b41;
            margin-bottom: 18px;
            font-weight: 600;
            font-size: 1rem;
            border-bottom: 2px dashed #9abb90;
            padding-bottom: 10px;
        }
        .card {
            background: #f9fff7;
            border-radius: 32px;
            padding: 22px 16px;
            margin-bottom: 22px;
            box-shadow: 0 10px 16px rgba(25, 55, 20, 0.08);
            border: 1px solid #bfdbb4;
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.45rem;
            color: #1f4a24;
            margin-bottom: 20px;
            border-left: 10px solid #5fa05b;
            padding-left: 16px;
        }
        .two-column {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        @media (min-width: 480px) {
            .two-column {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }
        }
        .stat-box {
            background: #ecf6e7;
            border-radius: 24px;
            padding: 18px 14px;
            border: 1px solid #aace9c;
        }
        .stat-box h3 {
            font-size: 1.25rem;
            margin-bottom: 14px;
            color: #235f28;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            color: #2e6b33;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #b1d0a4;
            border-radius: 24px;
            background: white;
            font-size: 1.1rem;
            transition: border 0.15s;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #3f9140;
            box-shadow: 0 0 0 4px rgba(63, 145, 64, 0.15);
        }
        .result-badge {
            background: #1c451c;
            color: #f2fce8;
            padding: 14px 16px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 1.6rem;
            text-align: center;
            margin-top: 12px;
            box-shadow: inset 0 2px 5px #0f2a0f;
            letter-spacing: 1px;
        }
        .result-badge.hp-badge {
            background: #6b3e3e;
        }
        .fill-btn {
            background: #c7e2bd;
            border: 2px solid #528a4e;
            color: #153d18;
            font-weight: 700;
            padding: 14px 12px;
            border-radius: 48px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.1s;
            margin-top: 12px;
            width: 100%;
            box-shadow: 0 3px 0 #3f6e3a;
        }
        .fill-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        .damage-formula-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .damage-formula-row .input-group {
            flex: 1 1 140px;
            min-width: 120px;
            margin-bottom: 0;
        }
        .damage-preview {
            background: linear-gradient(145deg, #194019, #2a632a);
            border-radius: 60px;
            padding: 20px 18px;
            color: #faffeb;
            text-align: center;
            margin: 20px 0 12px;
            border: 2px solid #b1da94;
        }
        .damage-number {
            font-size: 3.8rem;
            font-weight: 1000;
            line-height: 1.2;
            text-shadow: 4px 4px 0 #0f2a0f;
        }
        .damage-label {
            font-size: 1.1rem;
            letter-spacing: 3px;
            opacity: 0.9;
            font-weight: 500;
        }
        .footnote {
            font-size: 0.9rem;
            color: #407540;
            margin-top: 14px;
            text-align: center;
        }
        .flex-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        @media (min-width: 400px) {
            .flex-row {
                flex-direction: row;
            }
        }
        button {
            background: #408040;
            border: none;
            color: white;
            font-weight: bold;
            padding: 16px 20px;
            border-radius: 60px;
            font-size: 1.2rem;
            cursor: pointer;
            border: 2px solid #1c531c;
            box-shadow: 0 5px 0 #1d421d;
            transition: 0.1s;
            width: 100%;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1e3e1e;
        }
        .small-note {
            color: #3e6a3e;
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .type-selector {
            display: flex;
            gap: 12px;
            margin: 8px 0 18px;
        }
        .type-btn {
            background: #d9ecce;
            border: 2px solid #6da166;
            border-radius: 60px;
            padding: 16px 8px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1c481c;
            cursor: pointer;
            flex: 1;
            text-align: center;
            transition: all 0.1s;
            box-shadow: 0 3px 0 #4f7949;
        }
        .type-btn.active {
            background: #2f7a2f;
            color: white;
            border-color: #135013;
            box-shadow: inset 0 3px 6px #1d351d;
        }
        .type-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        .toggle-btn {
            background: #6b4f8c;
            border-color: #3e2a54;
            box-shadow: 0 5px 0 #2d1e3c;
            margin-bottom: 16px;
        }
        .toggle-btn.active-toggle {
            background: #9e6bb5;
        }
        .mark-panel {
            background: #f3ebf9;
            border-radius: 30px;
            padding: 18px 16px;
            margin: 16px 0;
            border: 2px dashed #9b72b5;
        }
        .solve-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            background: #fff9e6;
            border-radius: 30px;
            padding: 18px 16px;
            margin: 16px 0;
            border: 2px solid #dcc98a;
        }
        .solve-row .input-group {
            margin-bottom: 0;
            flex: 1 1 120px;
            min-width: 100px;
        }
        .solve-btn {
            background: #bf8f2c;
            border-color: #7a5a1a;
            box-shadow: 0 5px 0 #6b4a14;
            flex: 0 0 auto;
            min-width: 90px;
        }
        .solve-result-box {
            background: #fef9e7;
            border-radius: 24px;
            padding: 16px;
            margin: 12px 0;
            border: 2px solid #e6c560;
            font-size: 1.05rem;
            color: #5a4720;
            font-weight: 600;
            text-align: center;
        }
        @media (max-width: 380px) {
            .damage-formula-row .input-group {
                min-width: 100%;
            }
            .card {
                padding: 18px 12px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
        select {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path fill="%23336633" d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 22px;
            padding-right: 48px !important;
        }
        .formula-note {
            background: #def0d4;
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 0.95rem;
            color: #2b5e2b;
            text-align: center;
            font-weight: 600;
        }
        .hp-formula {
            background: #f9f2e0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚔️ 洛克伤害仪 ⚔️</h1>
    <div class="subhead">种族·个体·性格 · 威力连击 · 星陨印记</div>

    <!-- 能力值工坊 -->
    <div class="card">
        <div class="card-title"><span>📊 能力值工坊</span></div>
        <div class="two-column">
            <div class="stat-box">
                <h3>⚡ 攻击方</h3>
                <div class="input-group">
                    <label>种族值 (攻击/魔攻)</label>
                    <input type="number" id="atkRace" value="120" min="1" max="300" step="1" inputmode="numeric">
                </div>
                <div class="input-group">
                    <label>初始个体值 (0~10)</label>
                    <input type="number" id="atkIndiv" value="10" min="0" max="10" step="1" inputmode="numeric">
                </div>
                <div class="input-group">
                    <label>性格修正</label>
                    <select id="atkNature">
                        <option value="0.2">➕ +20% (加成)</option>
                        <option value="0" selected>🟰 0% (无修正)</option>
                        <option value="-0.1">➖ -10% (削弱)</option>
                    </select>
                </div>
                <div class="result-badge" id="atkResult">0</div>
                <button class="fill-btn" id="fillAtkToDamage">⬆️ 填入攻击力</button>
            </div>
            <div class="stat-box">
                <h3>🛡️ 防御方</h3>
                <div class="input-group">
                    <label>种族值 (防御/魔抗)</label>
                    <input type="number" id="defRace" value="100" min="1" max="300" step="1" inputmode="numeric">
                </div>
                <div class="input-group">
                    <label>初始个体值 (0~10)</label>
                    <input type="number" id="defIndiv" value="10" min="0" max="10" step="1" inputmode="numeric">
                </div>
                <div class="input-group">
                    <label>性格修正</label>
                    <select id="defNature">
                        <option value="0.2">➕ +20% (加成)</option>
                        <option value="0" selected>🟰 0% (无修正)</option>
                        <option value="-0.1">➖ -10% (削弱)</option>
                    </select>
                </div>
                <div class="result-badge" id="defResult">0</div>
                <button class="fill-btn" id="fillDefToDamage">⬇️ 填入防御力</button>
            </div>
        </div>
        <!-- 生命值 -->
        <div class="stat-box" style="margin-top: 18px;">
            <h3>❤️ 生命值</h3>
            <div class="flex-row" style="gap: 12px;">
                <div class="input-group" style="flex:1;">
                    <label>种族值</label>
                    <input type="number" id="hpRace" value="150" min="1" max="300" step="1" inputmode="numeric">
                </div>
                <div class="input-group" style="flex:1;">
                    <label>初始个体值 (0~10)</label>
                    <input type="number" id="hpIndiv" value="10" min="0" max="10" step="1" inputmode="numeric">
                </div>
                <div class="input-group" style="flex:1;">
                    <label>性格修正</label>
                    <select id="hpNature">
                        <option value="0.2">➕ +20%</option>
                        <option value="0" selected>🟰 0%</option>
                        <option value="-0.1">➖ -10%</option>
                    </select>
                </div>
            </div>
            <div class="result-badge hp-badge" id="hpResult">0</div>
            <button class="fill-btn" id="fillHPToTarget" style="background:#c2a15b; border-color:#8b6f2d;">🎯 填入目标生命值</button>
            <div class="formula-note hp-formula" style="margin-top:8px;">
                💡 [1.7×种族 + 个体×0.85×6 + 70]×(1+性格) + 100
            </div>
        </div>
        <div class="formula-note" style="margin-top:12px;">
            💡 其他能力: [1.1×种族 + 个体×0.55×6 + 10]×(1+性格) + 50
        </div>
    </div>

    <!-- 伤害演算 -->
    <div class="card">
        <div class="card-title"><span>💥 伤害演算</span></div>
        
        <div class="type-selector">
            <div class="type-btn active" id="typePhysical">⚔️ 物理</div>
            <div class="type-btn" id="typeMagic">🔮 魔法</div>
        </div>

        <div class="flex-row">
            <div class="input-group" style="flex:1;">
                <label>🗡️ 攻击力</label>
                <input type="number" id="damageAtk" value="200" min="0" step="0.1" inputmode="decimal">
            </div>
            <div class="input-group" style="flex:1;">
                <label>🛡️ 防御力</label>
                <input type="number" id="damageDef" value="180" min="1" step="0.1" inputmode="decimal">
            </div>
        </div>

        <div class="damage-formula-row">
            <div class="input-group">
                <label>a · 基础威力</label>
                <input type="number" id="powerA" value="90" min="1" step="1" inputmode="numeric">
            </div>
            <div class="input-group">
                <label>f · 威力增加</label>
                <input type="number" id="powerF" value="0" min="0" step="1" inputmode="numeric">
            </div>
        </div>

        <button class="toggle-btn" id="toggleStarMark">⭐ 星陨印记 (点击启用)</button>
        <div id="starMarkPanel" class="mark-panel" style="display: none;">
            <div class="input-group" style="margin-bottom: 8px;">
                <label>印记层数 x</label>
                <input type="number" id="markX" value="0" min="0" step="1" inputmode="numeric">
            </div>
            <div class="small-note" style="margin-bottom: 8px;">
                📐 印记威力 y = x² + 24x - 24
            </div>
            <div class="result-badge" style="font-size:1.4rem; background:#4e326b;" id="markYResult">0</div>
            <div class="small-note" style="margin-top:6px; color:#7a4a9a;">※ 印记伤害无本系加成 (b=1.0)</div>
        </div>

        <div class="damage-formula-row">
            <div class="input-group">
                <label>b · 本系加成</label>
                <select id="stabB">
                    <option value="1.0">1.0 (非本系)</option>
                    <option value="1.25" selected>1.25 (本系)</option>
                </select>
            </div>
            <div class="input-group">
                <label>c · 属性克制</label>
                <select id="typeC">
                    <option value="3.0">3.0 (双重克制?)</option>
                    <option value="2.0" selected>2.0 (单克制)</option>
                    <option value="1.0">1.0 (正常)</option>
                    <option value="0.5">0.5 (抵抗)</option>
                    <option value="0.333">0.333 (1/3抵抗)</option>
                </select>
            </div>
        </div>

        <div class="damage-formula-row">
            <div class="input-group">
                <label>d · 增减益</label>
                <input type="number" id="buffD" value="1.0" step="0.1" min="0.1" inputmode="decimal">
            </div>
            <div class="input-group">
                <label>e · 连击数</label>
                <input type="number" id="comboE" value="1" min="1" step="1" inputmode="numeric">
            </div>
        </div>

        <!-- 求解击杀条件 -->
        <div class="solve-row">
            <div class="input-group">
                <label>🎯 目标生命值</label>
                <input type="number" id="targetHP" value="500" min="1" step="1" inputmode="numeric">
            </div>
            <div class="input-group">
                <label>求解变量</label>
                <select id="solveVar">
                    <option value="atk">攻击力</option>
                    <option value="a">基础威力 a</option>
                    <option value="f">威力增加 f</option>
                    <option value="d">增减益 d</option>
                    <option value="e">连击数 e</option>
                </select>
            </div>
            <button class="solve-btn" id="solveBtn">🔍 求解</button>
        </div>
        <div id="solveResult" class="solve-result-box" style="display: none;"></div>

        <div class="damage-preview">
            <div class="damage-label">总伤害</div>
            <div class="damage-number" id="damageOutput">--</div>
        </div>
        <div id="damageNote" class="small-note" style="text-align:center;"></div>
        <button id="calcDamageBtn">🔥 计算伤害</button>
    </div>
    <div class="footnote">
        * 总伤害 = 技能伤害 + 星陨印记伤害 (印记无本系加成)
    </div>
</div>

<script>
    (function(){
        "use strict";

        // ---------- 新版能力值公式 ----------
        function calcOtherAbility(race, indiv, natureRate) {
            race = parseFloat(race) || 0;
            indiv = parseFloat(indiv) || 0;
            natureRate = parseFloat(natureRate) || 0;
            // 个体值项 × 0.55 × 6
            const inner = 1.1 * race + indiv * 0.55 * 6 + 10;
            let result = inner * (1 + natureRate) + 50;
            return Math.round(result * 10) / 10;
        }

        function calcHP(race, indiv, natureRate) {
            race = parseFloat(race) || 0;
            indiv = parseFloat(indiv) || 0;
            natureRate = parseFloat(natureRate) || 0;
            // 个体值项 × 0.85 × 6
            const inner = 1.7 * race + indiv * 0.85 * 6 + 70;
            let result = inner * (1 + natureRate) + 100;
            return Math.round(result * 10) / 10;
        }

        // DOM 元素
        const atkRace = document.getElementById('atkRace');
        const atkIndiv = document.getElementById('atkIndiv');
        const atkNature = document.getElementById('atkNature');
        const atkResult = document.getElementById('atkResult');

        const defRace = document.getElementById('defRace');
        const defIndiv = document.getElementById('defIndiv');
        const defNature = document.getElementById('defNature');
        const defResult = document.getElementById('defResult');

        const hpRace = document.getElementById('hpRace');
        const hpIndiv = document.getElementById('hpIndiv');
        const hpNature = document.getElementById('hpNature');
        const hpResult = document.getElementById('hpResult');

        const damageAtk = document.getElementById('damageAtk');
        const damageDef = document.getElementById('damageDef');
        const powerA = document.getElementById('powerA');
        const powerF = document.getElementById('powerF');
        const stabB = document.getElementById('stabB');
        const typeC = document.getElementById('typeC');
        const buffD = document.getElementById('buffD');
        const comboE = document.getElementById('comboE');
        const damageOutput = document.getElementById('damageOutput');
        const damageNote = document.getElementById('damageNote');

        const toggleBtn = document.getElementById('toggleStarMark');
        const starPanel = document.getElementById('starMarkPanel');
        const markX = document.getElementById('markX');
        const markYResult = document.getElementById('markYResult');

        const btnPhysical = document.getElementById('typePhysical');
        const btnMagic = document.getElementById('typeMagic');
        let skillType = 'physical';
        let starMarkActive = false;

        const targetHP = document.getElementById('targetHP');
        const solveVar = document.getElementById('solveVar');
        const solveBtn = document.getElementById('solveBtn');
        const solveResultDiv = document.getElementById('solveResult');

        function updateAbilityResults() {
            const aRace = parseFloat(atkRace.value) || 0;
            const aIndiv = parseFloat(atkIndiv.value) || 0;
            const aNat = parseFloat(atkNature.value) || 0;
            atkResult.textContent = calcOtherAbility(aRace, aIndiv, aNat).toFixed(1);

            const dRace = parseFloat(defRace.value) || 0;
            const dIndiv = parseFloat(defIndiv.value) || 0;
            const dNat = parseFloat(defNature.value) || 0;
            defResult.textContent = calcOtherAbility(dRace, dIndiv, dNat).toFixed(1);

            const hRace = parseFloat(hpRace.value) || 0;
            const hIndiv = parseFloat(hpIndiv.value) || 0;
            const hNat = parseFloat(hpNature.value) || 0;
            hpResult.textContent = calcHP(hRace, hIndiv, hNat).toFixed(1);
        }

        function calcStarMarkPower(x) {
            if (x < 0) x = 0;
            return x * x + 24 * x - 24;
        }

        function calcDamageSingle(power, atk, def, b, c, d, e) {
            return 0.9 * power * b * c * d * (atk / def) * e;
        }

        function getCommonParams() {
            const atk = parseFloat(damageAtk.value);
            const def = parseFloat(damageDef.value);
            const a = parseFloat(powerA.value) || 0;
            const f = parseFloat(powerF.value) || 0;
            const skillPower = a + f;
            const bSkill = parseFloat(stabB.value) || 1.0;
            const c = parseFloat(typeC.value) || 2.0;
            const d = parseFloat(buffD.value) || 1.0;
            const e = parseFloat(comboE.value) || 1;
            let markPower = 0;
            if (starMarkActive) {
                const x = parseFloat(markX.value) || 0;
                markPower = calcStarMarkPower(x);
            }
            return { atk, def, a, f, skillPower, bSkill, c, d, e, markPower };
        }

        function computeDamage() {
            const p = getCommonParams();
            if (isNaN(p.atk) || isNaN(p.def) || p.def === 0) {
                damageOutput.textContent = 'ERR';
                damageNote.textContent = '攻击/防御无效，防御不能为0';
                return 0;
            }

            const skillDamage = calcDamageSingle(p.skillPower, p.atk, p.def, p.bSkill, p.c, p.d, p.e);
            let markDamage = 0;
            if (starMarkActive) {
                markYResult.textContent = p.markPower.toFixed(1);
                markDamage = calcDamageSingle(p.markPower, p.atk, p.def, 1.0, p.c, p.d, p.e);
            } else {
                markYResult.textContent = '0';
            }

            const totalDamage = skillDamage + markDamage;
            damageOutput.textContent = totalDamage.toFixed(1);

            let typeStr = (skillType === 'physical') ? '物理' : '魔法';
            let markInfo = starMarkActive ? ` + 印记 ${markDamage.toFixed(1)} (威力${p.markPower.toFixed(1)})` : '';
            damageNote.textContent = `${typeStr} · 技能 ${skillDamage.toFixed(1)}${markInfo}`;
            return totalDamage;
        }

        function solveForVariable() {
            const p = getCommonParams();
            const target = parseFloat(targetHP.value);
            if (isNaN(target) || target <= 0) {
                solveResultDiv.style.display = 'block';
                solveResultDiv.textContent = '请输入有效的目标生命值';
                return;
            }
            if (isNaN(p.def) || p.def === 0) {
                solveResultDiv.style.display = 'block';
                solveResultDiv.textContent = '防御力不能为0';
                return;
            }

            const varType = solveVar.value;
            let requiredValue, resultDamage;

            const baseFactors = 0.9 * p.c * p.d * (1 / p.def);
            const powerTerm = p.skillPower * p.bSkill + p.markPower;

            if (varType === 'atk') {
                const coeff = baseFactors * powerTerm * p.e;
                if (coeff === 0) {
                    solveResultDiv.style.display = 'block';
                    solveResultDiv.textContent = '当前参数下伤害恒为0，无法求解';
                    return;
                }
                requiredValue = target / coeff;
                resultDamage = calcDamageSingle(p.skillPower, requiredValue, p.def, p.bSkill, p.c, p.d, p.e)
                              + (starMarkActive ? calcDamageSingle(p.markPower, requiredValue, p.def, 1.0, p.c, p.d, p.e) : 0);
                solveResultDiv.textContent = `最低攻击力 ≈ ${requiredValue.toFixed(1)}，对应伤害 ≈ ${resultDamage.toFixed(1)}`;
            } else if (varType === 'a') {
                const baseMult = 0.9 * p.c * p.d * (p.atk / p.def) * p.e;
                if (baseMult * p.bSkill === 0) {
                    solveResultDiv.style.display = 'block';
                    solveResultDiv.textContent = '无法通过基础威力调整伤害';
                    return;
                }
                requiredValue = (target / baseMult - p.markPower) / p.bSkill - p.f;
                requiredValue = Math.ceil(requiredValue);
                const newSkillPower = requiredValue + p.f;
                resultDamage = calcDamageSingle(newSkillPower, p.atk, p.def, p.bSkill, p.c, p.d, p.e)
                              + (starMarkActive ? calcDamageSingle(p.markPower, p.atk, p.def, 1.0, p.c, p.d, p.e) : 0);
                solveResultDiv.textContent = `最低基础威力 a ≈ ${requiredValue}，对应伤害 ≈ ${resultDamage.toFixed(1)}`;
            } else if (varType === 'f') {
                const baseMult = 0.9 * p.c * p.d * (p.atk / p.def) * p.e;
                if (baseMult * p.bSkill === 0) {
                    solveResultDiv.style.display = 'block';
                    solveResultDiv.textContent = '无法通过威力增加调整伤害';
                    return;
                }
                requiredValue = (target / baseMult - p.markPower) / p.bSkill - p.a;
                requiredValue = Math.ceil(Math.max(0, requiredValue));
                const newSkillPower = p.a + requiredValue;
                resultDamage = calcDamageSingle(newSkillPower, p.atk, p.def, p.bSkill, p.c, p.d, p.e)
                              + (starMarkActive ? calcDamageSingle(p.markPower, p.atk, p.def, 1.0, p.c, p.d, p.e) : 0);
                solveResultDiv.textContent = `最低威力增加 f ≈ ${requiredValue}，对应伤害 ≈ ${resultDamage.toFixed(1)}`;
            } else if (varType === 'd') {
                const baseMult = 0.9 * p.c * (p.atk / p.def) * p.e * powerTerm;
                if (baseMult === 0) {
                    solveResultDiv.style.display = 'block';
                    solveResultDiv.textContent = '无法通过增减益调整伤害';
                    return;
                }
                requiredValue = target / baseMult;
                requiredValue = Math.ceil(requiredValue * 10) / 10;
                resultDamage = calcDamageSingle(p.skillPower, p.atk, p.def, p.bSkill, p.c, requiredValue, p.e)
                              + (starMarkActive ? calcDamageSingle(p.markPower, p.atk, p.def, 1.0, p.c, requiredValue, p.e) : 0);
                solveResultDiv.textContent = `最低增减益 d ≈ ${requiredValue.toFixed(1)}，对应伤害 ≈ ${resultDamage.toFixed(1)}`;
            } else if (varType === 'e') {
                const baseMult = 0.9 * p.c * p.d * (p.atk / p.def) * powerTerm;
                if (baseMult === 0) {
                    solveResultDiv.style.display = 'block';
                    solveResultDiv.textContent = '无法通过连击数调整伤害';
                    return;
                }
                requiredValue = target / baseMult;
                requiredValue = Math.ceil(requiredValue);
                resultDamage = calcDamageSingle(p.skillPower, p.atk, p.def, p.bSkill, p.c, p.d, requiredValue)
                              + (starMarkActive ? calcDamageSingle(p.markPower, p.atk, p.def, 1.0, p.c, p.d, requiredValue) : 0);
                solveResultDiv.textContent = `最低连击数 e ≈ ${requiredValue}，对应伤害 ≈ ${resultDamage.toFixed(1)}`;
            }

            solveResultDiv.style.display = 'block';
        }

        function bindEvents() {
            const abilityInputs = [atkRace, atkIndiv, atkNature, defRace, defIndiv, defNature,
                                   hpRace, hpIndiv, hpNature];
            abilityInputs.forEach(el => el.addEventListener('input', updateAbilityResults));
            
            document.getElementById('fillAtkToDamage').addEventListener('click', function() {
                damageAtk.value = parseFloat(atkResult.textContent).toFixed(1);
                computeDamage();
            });
            document.getElementById('fillDefToDamage').addEventListener('click', function() {
                damageDef.value = parseFloat(defResult.textContent).toFixed(1);
                computeDamage();
            });
            document.getElementById('fillHPToTarget').addEventListener('click', function() {
                targetHP.value = parseFloat(hpResult.textContent).toFixed(1);
                computeDamage();
            });
            document.getElementById('calcDamageBtn').addEventListener('click', computeDamage);

            btnPhysical.addEventListener('click', function() {
                btnPhysical.classList.add('active');
                btnMagic.classList.remove('active');
                skillType = 'physical';
                computeDamage();
            });
            btnMagic.addEventListener('click', function() {
                btnMagic.classList.add('active');
                btnPhysical.classList.remove('active');
                skillType = 'magic';
                computeDamage();
            });

            toggleBtn.addEventListener('click', function() {
                starMarkActive = !starMarkActive;
                if (starMarkActive) {
                    starPanel.style.display = 'block';
                    toggleBtn.textContent = '⭐ 星陨印记 (已启用)';
                    toggleBtn.classList.add('active-toggle');
                } else {
                    starPanel.style.display = 'none';
                    toggleBtn.textContent = '⭐ 星陨印记 (点击启用)';
                    toggleBtn.classList.remove('active-toggle');
                }
                computeDamage();
            });

            markX.addEventListener('input', function() {
                if (starMarkActive) computeDamage();
            });

            const damageInputs = [damageAtk, damageDef, powerA, powerF, stabB, typeC, buffD, comboE, targetHP];
            damageInputs.forEach(el => el.addEventListener('input', computeDamage));
            stabB.addEventListener('change', computeDamage);
            typeC.addEventListener('change', computeDamage);

            solveBtn.addEventListener('click', solveForVariable);
            
            updateAbilityResults();
            setTimeout(() => {
                document.getElementById('fillAtkToDamage').click();
                document.getElementById('fillDefToDamage').click();
            }, 30);
        }

        function clampIndiv(inputEl, callback) {
            let val = parseInt(inputEl.value);
            if (isNaN(val)) val = 0;
            val = Math.min(10, Math.max(0, val));
            inputEl.value = val;
            if (callback) callback();
        }
        [atkIndiv, defIndiv, hpIndiv].forEach(inp => {
            inp.addEventListener('change', function() { clampIndiv(inp, updateAbilityResults); });
            inp.addEventListener('input', function() { 
                let v = parseInt(this.value); 
                if(!isNaN(v)) this.value = Math.min(10, Math.max(0, v));
            });
        });

        [atkRace, defRace, hpRace].forEach(inp => inp.addEventListener('change', function() {
            let v = parseFloat(this.value);
            if (v < 1) this.value = 1;
            updateAbilityResults();
        }));

        bindEvents();
    })();
</script>
</body>
</html>
